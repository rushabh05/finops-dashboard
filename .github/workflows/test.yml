name: test

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.13.0 is the declared minimum (node:sqlite without a flag); 22.x and 24.x are the current lines
        node: ['22.13.0', '22.x', '24.x']
    steps:
      # Windows checks files out with CRLF by default, which would change what the tests read
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # no `npm ci`: the project has no dependencies
      - run: npm test

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # builds the image and checks what the README promises: refuses to start without AUTH_TOKEN, serves, auth, Host check, non-root, health, volume
      - run: scripts/docker-smoke.sh finops-dashboard:ci
